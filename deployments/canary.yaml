apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:

  name: inference-canary

  annotations:

    nginx.ingress.kubernetes.io/canary: "true"

    nginx.ingress.kubernetes.io/canary-weight: "20"

spec:

  ingressClassName: nginx

  rules:

  - host: inference.local

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: vllm-service

            port:

              number: 8000