global:

  scrape_interval: 15s

rule_files:

  - alerts.yaml

scrape_configs:

- job_name: triton

  static_configs:

  - targets:
    - triton-service:8000

- job_name: vllm

  static_configs:

  - targets:
    - vllm-service:8000

- job_name: dcgm-exporter

  static_configs:

  - targets:
    - dcgm-exporter:9400